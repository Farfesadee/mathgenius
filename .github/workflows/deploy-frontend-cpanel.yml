name: Deploy Frontend to cPanel

# Builds the React app in CI and uploads ONLY the production
# build output (frontend/dist) to public_html over FTPS.
# No node_modules, no source, no zips touch the server.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-cpanel.yml'
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

concurrency:
  group: cpanel-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        run: npx vite build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./frontend/dist/
          server-dir: ./public_html/
          # false = overwrite changed files, never delete anything on the server.
          # (Keeps it safe; stale hashed assets in assets/ are harmless.)
          dangerous-clean-slate: false
          # NOTE: frontend/dist/.htaccess IS uploaded (it matches none of
          # these excludes). Do not add a rule that skips dotfiles.
          exclude: |
            **/.git*/**
            **/.github/**
            **/node_modules/**
